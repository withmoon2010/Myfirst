[project]
name = "daily-macro-brief"
version = "0.1.0"
description = "Daily macro & geopolitical news newsletter for portfolio managers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "aiosmtplib>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
